<!DOCTYPE html>
<html lang="en" data-phase="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Homepage</title>
  <!-- Fonts are self-hosted: this page opens on every new tab, so it must not
       wait on a third-party round trip or swap typefaces mid-glance. -->
  <link rel="preload" href="fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/plex-cond-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Login gate -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Homepage</h1>
      <!-- Password managers and screen readers expect a username field beside a
           password field, even though this app has a single implicit user. -->
      <input type="text" name="username" value="homepage" autocomplete="username"
             hidden aria-hidden="true" tabindex="-1" />
      <input id="login-pw" type="password" placeholder="Password"
             autocomplete="current-password" aria-label="Password" />
      <button type="submit" class="btn btn--primary">Unlock</button>
      <p id="login-err" class="login-err" role="alert"></p>
    </form>
  </div>

  <!-- Start page -->
  <div id="app" class="app" hidden>

    <header class="masthead">
      <p id="date" class="masthead-date"></p>
      <p id="weather" class="masthead-weather"></p>
      <button type="button" id="settings-open" class="ghost-btn">Settings</button>
    </header>

    <section id="ribbon-root" class="hero" aria-label="Today"></section>

    <div id="search-root" class="search-zone"></div>

    <main class="panels">
      <section class="panel">
        <h2 class="panel-title">Focus</h2>
        <div id="timer-root"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Queue</h2>
        <div id="tasks-root"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Jump</h2>
        <div id="favorites-root" class="fav-grid"></div>
      </section>
    </main>

    <section class="strip">
      <div class="strip-col">
        <h2 class="panel-title">Listen</h2>
        <div id="stations-root" class="stations"></div>
      </div>
      <div class="strip-col">
        <h2 class="panel-title">Notes</h2>
        <div id="notes-root" class="notes"></div>
      </div>
    </section>

    <div id="player" class="player" hidden></div>

    <!-- Settings -->
    <dialog id="settings" class="settings">
      <form method="dialog" class="settings-head">
        <h2>Settings</h2>
        <button class="ghost-btn" value="close">Done</button>
      </form>

      <div class="settings-body">

        <fieldset class="field">
          <legend>Timer</legend>
          <div class="field-grid">
            <label>Focus<input id="dur-pomodoro" type="number" min="1" max="180" /></label>
            <label>Short break<input id="dur-short" type="number" min="1" max="60" /></label>
            <label>Long break<input id="dur-long" type="number" min="1" max="60" /></label>
            <label>Long break every<input id="dur-interval" type="number" min="2" max="12" /></label>
          </div>
          <div class="field-row">
            <label>End sound<select id="sound-select"></select></label>
            <button type="button" id="sound-preview" class="btn">Play it</button>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Day</legend>
          <div class="field-grid">
            <label>Day starts<input id="ribbon-start" type="number" min="0" max="23" /></label>
            <label>Day ends<input id="ribbon-end" type="number" min="1" max="24" /></label>
            <label>Background<select id="ground-mode">
              <option value="auto">Follows the hour</option>
              <option value="light">Always light</option>
              <option value="dark">Always dark</option>
            </select></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Search</legend>
          <div class="field-row">
            <label>Engine<select id="engine-select"></select></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Weather</legend>
          <div class="field-row">
            <label>Town or city<input id="weather-query" type="text" placeholder="Tokyo" /></label>
            <button type="button" id="weather-search" class="btn">Find</button>
            <button type="button" id="weather-clear" class="btn">Clear</button>
          </div>
          <p id="weather-current" class="field-note"></p>
          <div id="weather-results" class="results"></div>
        </fieldset>

        <fieldset class="field">
          <legend>Favorite sites</legend>
          <p class="field-note">Up to eight. They show as letter tiles unless you turn on favicons.</p>
          <div id="favorites-editor" class="editor"></div>
          <label class="field-check">
            <input id="use-favicons" type="checkbox" />
            Use real favicons (fetches an icon per site from duckduckgo.com on every load)
          </label>
        </fieldset>

        <fieldset class="field">
          <legend>Listen</legend>
          <p class="field-note">
            Spotify or YouTube links. Nothing loads until you click a station, and
            audio only plays in the tab you started it from.
          </p>
          <div id="stations-editor" class="editor"></div>
        </fieldset>

        <div class="settings-foot">
          <button type="button" id="logout-btn" class="ghost-btn">Log out</button>
        </div>
      </div>
    </dialog>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
